<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <h1>Number Guessing Game</h1>

        <section class="instructions">
            <h2>How to Play</h2>
            <p>
                Guess a number between 1 and 100.
                Enter your guess and click the "Submit Guess" button.
            </p>
            <p>
                The game will tell you if your guess is too high,
                too low, or correct.
            </p>
        </section>

        <section class="game-area">

            <label for="guessInput">Enter your guess:</label>

            <input
                type="number"
                id="guessInput"
                placeholder="Enter number 1-100"
                min="1"
                max="100"
            >

            <div class="buttons">
                <button id="submitGuess">Submit Guess</button>
                <button id="resetGame">Reset Game</button>
            </div>

            <p id="feedback" class="feedback">
                Make your first guess!
            </p>

            <p>
                Attempts:
                <span id="attempts">0</span>
            </p>

            <p>
                Game Status:
                <span id="gameStatus">Playing</span>
            </p>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
