<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Grade Calculator</h1>

        <form id="gradeForm">

            <div class="input-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>

            <div class="input-group">
                <label for="rollNumber">Roll Number</label>
                <input type="text" id="rollNumber" placeholder="Enter roll number">
            </div>

            <h2>Subject Marks</h2>

            <div class="input-group">
                <label for="subject1">Subject 1 Marks</label>
                <input type="number" id="subject1" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label for="subject2">Subject 2 Marks</label>
                <input type="number" id="subject2" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label for="subject3">Subject 3 Marks</label>
                <input type="number" id="subject3" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label for="subject4">Subject 4 Marks</label>
                <input type="number" id="subject4" min="0" max="100" placeholder="0 - 100">
            </div>

            <div class="input-group">
                <label for="subject5">Subject 5 Marks</label>
                <input type="number" id="subject5" min="0" max="100" placeholder="0 - 100">
            </div>

            <p id="errorMessage"></p>

            <div class="buttons">
    <button type="submit" id="calculateButton">Calculate Result</button>
    <button type="button" id="resetButton">Reset</button>
</div>

        </form>

        <div class="result" id="resultSection">
            <h2>Result</h2>

            <p><strong>Student Name:</strong> <span id="displayName">-</span></p>
            <p><strong>Roll Number:</strong> <span id="displayRoll">-</span></p>
            <p><strong>Total Marks:</strong> <span id="totalMarks">-</span> / 500</p>
            <p><strong>Percentage:</strong> <span id="percentage">-</span></p>
            <p><strong>Grade:</strong> <span id="grade">-</span></p>
            <p><strong>Status:</strong> <span id="status">-</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
