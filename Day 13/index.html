<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator - Day 13</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <section class="calculator">

            <h1>Simple Calculator</h1>
            <p class="subtitle">ES6+ Refactored Version</p>

            <div class="input-group">
                <label for="num1">First Number</label>
                <input type="number" id="num1" placeholder="Enter first number">
            </div>

            <div class="input-group">
                <label for="num2">Second Number</label>
                <input type="number" id="num2" placeholder="Enter second number">
            </div>

            <div class="buttons">
                <button type="button" id="addBtn">+</button>
                <button type="button" id="subtractBtn">−</button>
                <button type="button" id="multiplyBtn">×</button>
                <button type="button" id="divideBtn">÷</button>
            </div>

            <div class="result-box">
                <h2>Result</h2>
                <p id="result">Enter numbers and select an operation.</p>
            </div>

            <button type="button" id="clearBtn" class="clear-btn">
                Clear
            </button>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
